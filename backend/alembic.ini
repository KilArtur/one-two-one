# Alembic config for backend migrations.
# Run from repo root:
#   uv run alembic -c backend/alembic.ini upgrade head
#   uv run alembic -c backend/alembic.ini downgrade -1

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

# Overridden in env.py from Settings / DATABASE_URL
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
