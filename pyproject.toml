[project]
name = "one-two-one"
version = "0.1.0"
description = "Асинхронное видеоинтервью для первичной технической оценки ИТ-кандидатов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
mypy_path = "backend"
