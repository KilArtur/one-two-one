[project]
name = "one-two-one-artur"
version = "0.1.0"
description = "AI interviewer monorepo scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "boto3>=1.40.0",
    "celery[redis]>=5.5.0",
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "langchain-openai>=1.6.0",
    "openai>=3.8.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20.0",
  "httpx>=0.28.1",
  "pytest>=8.4.2",
  "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".codex-home"]
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]
