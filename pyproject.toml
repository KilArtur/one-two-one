[project]
name = "one-two-one-artur"
version = "0.1.0"
description = "AI interviewer monorepo scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".codex-home"]

[tool.ruff.lint]
select = ["E", "F", "I"]
