ОНАЛИЗИРОВАННЫЙ НАБОР</div><h2>Карта и вопросы Ивана Петрова</h2><div class="fact-row"><b>Kafka / брокеры сообщений</b><span>Работал с RabbitMQ и Kafka в backend-системах</span><span class="origin resume">Из резюме · проверить</span></div><div class="fact-row"><b>PostgreSQL</b><span>Указана оптимизация запросов и массовой загрузки</span><span class="origin resume">Из резюме · проверить</span></div><div class="fact-row"><b>Async Python</b><span>Указана разработка асинхронных сервисов</span><span class="origin resume">Из резюме · проверить</span></div><section class="section" style="margin-bottom:18px"><div class="section-head"><div><div class="marker">[03]</div><h2>Дополнительные вопросы</h2></div></div><div class="question-card"><span class="tag">По резюме · Kafka</span><h3>Какой личный вклад вы внесли в обработку повторной доставки сообщений?</h3></div><div class="question-card"><span class="tag">По резюме · PostgreSQL</span><h3>Какие метрики изменились после оптимизации массовой загрузки?</h3></div><p class="meta">Уточняющие адаптивные вопросы окончательно выбираются во время интервью по фактически полученным ответам.</p></section><div class="inline" style="justify-content:flex-end"><button class="btn ghost" data-go="recruiter-questions">Проверить вопросы</button><button class="btn primary" data-action="generate-candidate-link">Сформировать ссылку кандидата</button></div>${state.candidateLinkCreated?'<div class="band" style="margin-top:18px"><b>Персональная demo-ссылка сформирована</b><div class="meta">Связана с Иваном Петровым, вакансией и зафиксированными версиями карты и вопросов.</div><button class="btn small" style="margin-top:14px" data-action="copy-link">Скопировать ссылку</button></div>':''}</section>`:''}`,'people')}
    function settings(){return recruiter(`${crumbs('Настройки')}${vacancyTabs('settings')}<div class="page-head"><div><div class="marker">[01] ВАКАНСИЯ ИЗ ФАЙЛА</div><h1>Настройки вакансии</h1><p>Все поля ниже распознаны из файла вакансии и доступны для ручного редактирования рекрутером.</p></div>${status('Источник подключён','success')}</div><section class="panel" style="margin-bottom:28px"><div class="inline" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap"><div><div class="marker">ИСХОДНЫЙ ФАЙЛ</div><h2 style="font-size:25px;font-weight:400;margin:8px 0">middle-python-developer-vacancy.demo</h2><p class="meta">Повторная загрузка обновит распознанные данные только после подтверждения кнопкой.</p></div><div><input id="vacancySettingsFile" type="file"><button class="btn small" data-action="parse-settings-file" ${state.vacancyFileUploaded?'':'disabled'} style="margin-left:8px">Обновить данные из файла</button></div></div></section><div class="panel"><div class="marker">[02] РЕДАКТИРУЕМАЯ КАРТОЧКА</div><div class="form-grid" style="margin-top:22px"><div class="form-group full"><label>Название роли</label><input value="${DATA.vacancy}"></div><div class="form-group"><label>Целевой грейд</label><select><option>Middle+</option><option>Middle</option><option>Senior</option></select></div><div class="form-group"><label>Статус вакансии</label><select><option>Активна</option><option>Черновик</option></select></div><div class="form-group full"><label>Описание роли</label><textarea>Backend-разработчик для проектирования и развития сервисов обработки данных и событий.</textarea></div><div class="form-group full"><label>Основные задачи</label><textarea>Разрабатывать Python-сервисы; обеспечивать надёжную обработку сообщений; оптимизировать работу с PostgreSQL; поддерживать асинхронные интеграции.</textarea></div><div class="form-group full"><label>Обязательные навыки · вес или приоритет каждого требования</label><textarea>Высокий — Kafka / гарантии доставки и идемпотентность\nВысокий — PostgreSQL / диагностика запросов и массовая загрузка</textarea></div><div class="form-group full"><label>Желательные навыки · вес или приоритет каждого требования</label><textarea>Средний — Async Python / безопасная работа с циклом событий</textarea></div><div class="form-group full"><label>Критичные стоп-факторы</label><textarea>Подтверждённое ответом незнание базовых гарантий обработки сообщений; отсутствие понимания идемпотентности для повторной доставки.</textarea></div><div class="form-group full"><label>Навыки, которые невозможно проверить данным интервью</label><textarea>Качество production-кода; командная совместимость; самостоятельность в длительной работе; соблюдение внутренних процессов разработки.</textarea></div></div><div class="source-row"><span class="source-chip confirmed">Заполнено из файла вакансии</span><span class="source-chip">Все поля редактируются</span></div></div><div class="inline" style="justify-content:flex-end;margin-top:24px"><button class="btn ghost" data-action="save">Сохранить изменения</button><button class="btn primary" data-go="recruiter-competencies">Продолжить к карте компетенций</button></div>`)}
    function competenciesSetup(){const rows=[{key:'kafka',name:'Kafka / надёжная обработка сообщений',type:'Обязательная',priority:'Высокий',confirm:'Понимание гарантий доставки, ручного подтверждения, идемпотентности и восстановления после сбоя; личный вклад в production-решение.'},{key:'postgres',name:'PostgreSQL',type:'Обязательная',priority:'Высокий',confirm:'Практическая диагностика запросов, работа с EXPLAIN ANALYZE, индексами и массовой загрузкой; измеримый результат.'},{key:'async',name:'Async Python',type:'Желательная',priority:'Средний',confirm:'Понимание цикла событий, блокирующих операций и границ между синхронным и асинхронным кодом.'},...(state.extraCompetency?[{key:'extra',name:'Новая компетенция',type:'Желательная',priority:'Низкий',confirm:'Опишите, какой опыт или знание кандидат должен подтвердить ответом.'}]:[])].filter(r=>!state.hiddenCompetencies.includes(r.key));return recruiter(`${crumbs('Компетенции')}${vacancyTabs('competencies')}<div class="page-head"><div><div class="marker">[01] КАРТА КОМПЕТЕНЦИЙ</div><h1>Карта компетенций</h1><p>Матрица сформирована из требований вакансии. Здесь рекрутер может изменить любую ячейку, удалить лишнюю строку или добавить компетенцию, которую парсер не выделил.</p></div><button class="btn primary" data-action="add-competency">+ Добавить компетенцию</button></div><div class="matrix"><div class="matrix-row header"><div>Компетенция</div><div>Тип</div><div>Приоритет</div><div>Что нужно подтвердить</div><div></div></div>${rows.map(r=>`<div class="matrix-row"><div><input value="${r.name}" aria-label="Компетенция"></div><div><select aria-label="Тип"><option ${r.type==='Обязательная'?'selected':''}>Обязательная</option><option ${r.type==='Желательная'?'selected':''}>Желательная</option><option>Дополнительная</option></select></div><div><select aria-label="Приоритет"><option ${r.priority==='Высокий'?'selected':''}>Высокий</option><option ${r.priority==='Средний'?'selected':''}>Средний</option><option ${r.priority==='Низкий'?'selected':''}>Низкий</option></select></div><div><textarea aria-label="Что нужно подтвердить">${r.confirm}</textarea></div><button class="icon-button" data-action="delete-competency" data-key="${r.key}" aria-label="Удалить компетенцию">×</button></div>`).join('')}</div>${rows.length===0?'<div class="empty">Добавьте хотя бы одну компетенцию для формирования вопросов.</div>':''}<div class="band" style="margin-top:22px"><b>Источник структуры: файл вакансии</b><p class="meta">Матрица не содержит статусов оценки кандидата: это конфигурация того, что интервью должно проверить.</p></div><div class="inline" style="justify-content:flex-end;margin-top:24px"><button class="btn ghost" data-action="save">Сохранить изменения</button><button class="btn primary" data-go="recruiter-questions">Продолжить к вопросам</button></div>`)}
    function questions(){const groups=[{key:'kafka',competency:'Kafka / надёжная обработка сообщений',core:'Расскажите о системе с брокером сообщений, где нужно было обеспечить надёжную обработку при сбоях.',subs:[['k1','Что именно в этом решении сделали лично вы и за какую часть отвечали?'],['k2','Как система вела себя при повторной доставке сообщения?'],['k3','Какими метриками вы проверили, что решение стало надёжнее?']]},{key:'postgres',competency:'PostgreSQL',core:'Расскажите о случае, когда вам пришлось диагностировать и ускорять медленный запрос PostgreSQL.',subs:[['p1','С чего вы начали диагностику и что увидели в плане запроса?'],['p2','Как вы проверили, что изменение индекса не ухудшило запись?'],['p3','Какой измеримый результат был получен в production?']]},{key:'async',competency:'Async Python',core:'Расскажите о ситуации, когда блокирующая операция повлияла на асинхронный Python-сервис.',subs:[['a1','Как вы обнаружили блокировку цикла событий?'],['a2','Почему выбрали executor, а не асинхронный клиент?'],['a3','Какую часть исправления реализовали лично вы?']]},...(state.extraQuestion?[{key:'extraq',competency:'Новая компетенция',core:'Введите основной вопрос для новой компетенции.',subs:[['e1','Введите адаптивный уточняющий вопрос.']]}]:[])].filter(g=>!state.hiddenQuestions.includes(g.key));return recruiter(`${crumbs('Вопросы')}${vacancyTabs('questions')}<div class="page-head"><div><div class="marker">[01] ОСНОВНЫЕ И АДАПТИВНЫЕ ВОПРОСЫ</div><h1>Вопросы</h1><p>Каждый основной вопрос связан с компетенцией и содержит несколько адаптивных уточнений для проверки технической глубины, практического опыта, личного вклада и результата.</p></div><button class="btn primary" data-action="add-core-question">+ Добавить основной вопрос</button></div><div class="band" style="margin-bottom:28px"><div class="inline" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap"><div><b>Источники набора</b><div class="source-row"><span class="source-chip confirmed">Файл вакансии</span>${state.specialistFileUploaded?'<span class="source-chip confirmed">Файл технического специалиста</span>':'<span class="source-chip">Файл технического специалиста не добавлен</span>'}</div><p class="meta">Все сгенерированные формулировки можно изменить или удалить до сохранения вакансии.</p></div><label class="btn small ghost">Добавить файл вопросов<input id="questionFile" class="sr-only" type="file"></label></div></div><div class="question-editor-list">${groups.map(g=>{const subs=[...g.subs,...(state.extraFollowups.includes(g.key)?[[`extra-${g.key}`,'Введите новый адаптивный вопрос.']]:[])].filter(s=>!state.hiddenFollowups.includes(s[0]));return `<article class="question-editor"><div class="question-editor-head"><div><div class="marker">КОМПЕТЕНЦИЯ</div><h3>${g.competency}</h3></div><button class="btn small ghost" data-action="delete-core-question" data-key="${g.key}">Удалить основной вопрос</button></div><div class="form-group"><label>Основной вопрос</label><textarea>${g.core}</textarea></div><div class="adaptive-list"><div class="marker" style="padding:14px 18px 4px">АДАПТИВНЫЕ УТОЧНЕНИЯ · ${subs.length}</div>${subs.map((s,i)=>`<div class="adaptive-item"><label>Уточнение ${String(i+1).padStart(2,'0')}</label><textarea>${s[1]}</textarea><div class="question-actions"><button class="icon-button" data-action="delete-followup" data-key="${s[0]}" aria-label="Удалить уточнение">×</button></div></div>`).join('')}<div style="padding:14px 18px"><button class="btn small" data-action="add-followup" data-group="${g.key}">+ Добавить уточнение</button></div></div></article>`}).join('')}</div>${groups.length===0?'<div class="empty">Добавьте основной вопрос, чтобы завершить настройку вакансии.</div>':''}<div class="inline" style="justify-content:flex-end;margin-top:26px"><button class="btn ghost" data-go="recruiter-competencies">Назад к компетенциям</button><button class="btn primary" data-action="save-vacancy">Сохранить вакансию</button></div>`)}
    function candidates(){const filtered=DATA.candidates.filter(c=>state.candidateFilter==='Все'||c.state===state.candidateFilter);return recruiter(`<div class="page-head"><div><div class="marker">[01] КАНДИДАТЫ</div><h1>Кандидаты</h1><p>Отдельный рабочий раздел. Вакансия используется как фильтр и контекст сравнения, но не как вложенная вкладка.</p></div><button class="btn primary" data-go="recruiter-candidate-create">Добавить кандидата</button></div><div class="summary-strip" style="margin-bottom:34px"><div class="summary-cell"><strong>4</strong><span>всего</span></div><div class="summary-cell"><strong>2</strong><span>результата готово</span></div><div class="summary-cell"><strong>1</strong><span>в обработке</span></div><div class="summary-cell"><strong>1</strong><span>нужно восстановление</span></div></div><div class="filterbar"><select class="field"><option>${DATA.vacancy}</option><option>Все вакансии</option></select><label class="sr-only" for="candidateFilter">Статус</label><select id="candidateFilter" class="field"><option ${state.candidateFilter==='Все'?'selected':''}>Все</option><option ${state.candidateFilter==='Готов'?'selected':''}>Готов</option><option ${state.candidateFilter==='Обработка'?'selected':''}>Обработка</option><option ${state.candidateFilter==='Интервью прервано'?'selected':''}>Интервью прервано</option></select><div class="spacer"></div><label class="toggle"><input type="checkbox" id="rankingToggle" ${state.stretchRanking?'checked':''}><span>Stretch: очередь просмотра</span></label>${state.stretchRanking?'<button class="btn small" data-go="recruiter-review-order">Открыть очередь</button>':''}</div><div class="table-wrap"><table><thead><tr><th>Кандидат</th><th>Вакансия</th><th>Статус</th><th>Рекомендация</th><th>Оценка</th><th>Покрытие</th><th>Уверенность</th></tr></thead><tbody>${filtered.map(c=>`<tr class="clickable" data-go="${c.id==='Алексей Кузнецов'?'recruiter-result':c.id==='Мария Орлова'?'recruiter-result-one':'recruiter-status'}"><td class="title-cell">${c.id}<div class="cell-sub">Персональная ссылка</div></td><td>${DATA.vacancy}</td><td>${status(c.state,c.state==='Готов'?'success':c.state==='Обработка'?'blue':'warning')}</td><td>${c.recommendation}</td><td>${c.score}</td><td>${c.coverage}</td><td>${c.confidence}</td></tr>`).join('')}</tbody></table></div>`,'people')}
    function newInterview(){return recruiter(`${crumbs('Новое интервью')}<div class="page-head"><div><div class="marker">[01] CREATE INTERVIEW</div><h1>Новое интервью</h1><p>Кандидат, резюме и версии оценки фиксируются вместе.</p></div></div><div class="two-col"><div class="panel"><div class="form-grid"><div class="form-group full"><label>Идентификатор кандидата</label><input value="Иван Петров"></div><div class="form-group full"><label>Резюме</label><div class="band" style="border-color:var(--line)">Перетащите файл или выберите на устройстве<br><span class="meta">Поддерживаемые форматы требуют решения</span></div></div><div class="form-group"><label>Версия вакансии</label><select><option>Vacancy v1.4</option></select></div><div class="form-group"><label>Набор вопросов</label><select><option>Question set v1.2</option></select></div></div></div><aside class="panel"><div class="marker">[02] FIXED CONFIGURATION</div><h2 style="font-size:28px">${DATA.vacancy}</h2><ul class="list-lines"><li>3 competency blueprints</li><li>Human-reviewed questions</li><li>Budget: из конфигурации</li><li>Политика попыток: требует решения</li></ul></aside></div><div class="inline" style="justify-content:flex-end;margin-top:24px"><button class="btn ghost" data-go="recruiter-candidates">Отменить</button><button class="btn primary" data-action="create-link">Создать персональную ссылку</button></div>`)}
    function interviewStatus(){return recruiter(`${crumbs('Статус интервью')}<div class="page-head"><div><div class="marker">[01] INTERVIEW STATUS</div><h1>Статус интервью</h1><p>Елена Волкова · восстановимый технический сбой. Профессиональные метрики появятся только после завершения анализа.</p></div><button class="btn" data-go="recruiter-candidates">Назад к кандидатам</button></div><div class="agent-timeline"><div class="agent-step good"><div class="num">01</div><div><h3>Приглашение открыто</h3><p>Вчера, 18:04</p></div></div><div class="agent-step good"><div class="num">02</div><div><h3>Интервью начато</h3><p>Проверка оборудования пройдена.</p></div></div><div class="agent-step accent"><div class="num">03</div><div><h3>Последний checkpoint сохранён</h3><p>Два завершённых ответа загружены.</p></div></div><div class="agent-step"><div class="num">04</div><div><h3>Камера временно недоступна</h3><p>Кандидат может продолжить с незавершённого вопроса. Начинать интервью заново не нужно.</p></div></div><div class="agent-step"><div class="num">05</div><div><h3>Обработка и результат</h3><p>Ожидают завершения интервью. Score, coverage, confidence: —</p></div></div></div><div class="inline" style="justify-content:flex-end;margin-top:22px"><button class="btn" data-action="copy-link">Скопировать ссылку</button></div>`)}
    function reviewOrder(){const rows=[{...DATA.candidates[1],reason:'Высокая оценка, но покрытие 78% и средняя уверенность: человеку нужно проверить недостающие доказательства.'},{...DATA.candidates[0],reason:'Решение уже достаточно ясное: покрытие выше, уверенность высокая, срочность ручной проверки ниже.'}];return recruiter(`${crumbs('Рекомендуемая очередность просмотра')}${vacancyTabs('candidates')}<div class="stretch-banner"><div><b>Stretch · Рекомендуемая очередность просмотра</b><div class="meta">Приоритет ручной проверки внутри ${DATA.vacancy}. Это не рейтинг качества людей и не основание для автоотказа.</div></div><button class="btn small" data-go="recruiter-candidates">Назад</button></div><div class="page-head" style="margin-top:40px"><div><div class="marker">[01] ПРИОРИТЕТ ПРОСМОТРА</div><h1>Рекомендуемая<br>очередность просмотра</h1><p>Система сначала поднимает результаты, где решение требует участия человека, а не кандидатов с максимальной или минимальной оценкой.</p></div></div><div class="decision-model"><div><div class="marker">01</div><b>Статус решения</b><p>Дополнительная проверка повышает срочность просмотра.</p></div><div><div class="marker">02</div><b>Покрытие</b><p>Показывает, какая доля проверяемых требований подтверждена доказательствами.</p></div><div><div class="marker">03</div><b>Уверенность</b><p>Учитывает качество, прямоту и согласованность доказательств.</p></div><div><div class="marker">04</div><b>Критичность</b><p>Обязательные требования и открытые стоп-факторы важнее желательных навыков.</p></div></div><section class="section"><div class="table-wrap"><table><thead><tr><th>Порядок</th><th>Кандидат</th><th>Рекомендация</th><th>Оценка</th><th>Покрытие</th><th>Уверенность</th><th>Почему сейчас</th></tr></thead><tbody>${rows.map((c,i)=>`<tr class="clickable" data-go="${c.id==='Алексей Кузнецов'?'recruiter-result':'recruiter-result-one'}"><td class="position">0${i+1}</td><td class="title-cell">${c.id}</td><td>${c.recommendation}</td><td>${c.score}</td><td>${c.coverage}</td><td>${c.confidence}</td><td class="review-reason">${c.reason}</td></tr>`).join('')}</tbody></table></div><p class="meta" style="margin-top:14px">Кандидаты в обработке и прерванные интервью не ранжируются профессионально. Численные веса очереди и пороги рекомендации требуют продуктовой валидации перед MVP.</p></section>`)}
    function competencyRows(role='recruiter',competencies=DATA.competencies,candidateKey='alexey'){const askedSets={alexey:{kafka:[{kind:'Основной',q:'Расскажите о системе с брокером сообщений, где нужно было обеспечить надёжную обработку при сбоях.',time:'03:48',quote:'Основная проблема была в повторной обработке при сбое.'},{kind:'Адаптивный',q:'Что именно в этом решении сделали лично вы?',time:'04:32',quote:'Я переписал consumer и настроил ручной commit после записи результата.'}],postgres:[{kind:'Основной',q:'Расскажите о диагностике медленного запроса PostgreSQL.',time:'07:18',quote:'Я начал с EXPLAIN ANALYZE и увидел последовательное чтение.'},{kind:'Адаптивный',q:'Какой измеримый результат был получен?',time:'08:02',quote:'Точную production-метрику нужно поднять отдельно.'}],async:[{kind:'Основной',q:'Когда блокирующая операция повлияла на асинхронный сервис?',time:'11:06',quote:'Синхронный клиент блокировал event loop.'},{kind:'Адаптивный',q:'Какую часть исправления реализовали лично вы?',time:'11:42',quote:'Реализацию общего адаптера делал другой разработчик.'}]},maria:{kafka:[{kind:'Основной',q:'Расскажите о системе Kafka, где обработка должна была переживать повторную доставку.',time:'02:14',quote:'Обработка должна была оставаться безопасной при повторной доставке.'},{kind:'Адаптивный',q:'Что именно в этом решении сделали лично вы?',time:'03:06',quote:'Я добавила идемпотентный обработчик и перенесла commit после успешной записи транзакции.'}],postgres:[{kind:'Основной',q:'Расскажите о диагностике и ускорении запроса PostgreSQL.',time:'06:22',quote:'Я сравнила фактический и ожидаемый план через EXPLAIN ANALYZE.'},{kind:'Адаптивный',q:'Какой измеримый результат был получен?',time:'07:11',quote:'После изменения индекса p95 снизился с 480 до 170 миллисекунд.'}],async:[{kind:'Основной',q:'Как вы устраняли блокирующую операцию в асинхронном сервисе?',time:'10:04',quote:'Мы вынесли блокирующий вызов в executor и ограничили число параллельных задач.'},{kind:'Адаптивный',q:'Какими метриками подтвердили результат?',time:'10:48',quote:'Точной нагрузочной метрики по этому сервису у меня сейчас нет.'}]}};const asked=askedSets[candidateKey];return `<div class="competency-table"><div class="comp-head"><div>Компетенция</div><div>Приоритет</div><div>Оценка</div><div>Согласованность</div><div>Вопросы / доказательства</div></div>${competencies.map(c=>`<article class="comp-row ${state.compOpen===c.key?'open':''}" data-key="${c.key}"><div class="comp-summary" tabindex="0" role="button" aria-expanded="${state.compOpen===c.key}"><div class="comp-name"><span class="chev">›</span>${c.name}</div><div>${c.priority==='Must-have'?'Обязательно':'Желательно'}</div><div>${status(c.status,c.tone)}</div><div>${c.consistency}</div><div>2 вопроса · ${c.evidence.replace('evidence','факта')}<br><span class="meta">${c.time} · раскрыть</span></div></div><div class="comp-detail"><div class="competency-analysis-head"><div><div class="eyebrow">АНАЛИЗ КОМПЕТЕНЦИИ</div><h3>Оценка связана с конкретными ответами</h3></div><button class="video-link" data-evidence="${c.key}" data-candidate="${candidateKey}" data-time="${c.time}">Ссылка на видео кандидата · <strong>${c.time}</strong></button></div><div class="dim-grid"><div class="dimension"><small>Техническая глубина</small><strong>${c.tech}</strong></div><div class="dimension"><small>Практический опыт</small><strong>${c.practice}</strong></div><div class="dimension"><small>Личный вклад</small><strong>${c.personal}</strong></div><div class="dimension"><small>Масштаб, результат, метрики</small><strong>${c.scale}</strong></div></div><div class="evidence-grid"><div><div class="eyebrow">Источник: ответ кандидата</div><p class="quote">«${c.quote}»</p><button class="timestamp" data-evidence="${c.key}" data-candidate="${candidateKey}" data-time="${c.time}">${c.time} · Открыть доказательство</button><div class="origin answer" style="margin-top:8px">Подтверждено ответом</div></div><div><div class="eyebrow">Источник: резюме</div><p>${c.claim}</p><div class="origin resume">Контекст · не входит в оценку без ответа</div></div><div><div class="eyebrow">Недостающие доказательства</div><p>${c.missing}</p><div class="meta">Уверенность: ${c.confidence}</div></div></div><div class="asked-questions"><div class="asked-questions-head"><div><div class="eyebrow">ВОПРОСЫ, ОТВЕТЫ И ВИДЕО</div><p>Основной и адаптивный вопросы, на основании которых сформирована оценка.</p></div><button class="video-link" data-evidence="${c.key}" data-candidate="${candidateKey}" data-time="${asked[c.key][0].time}">Ссылка на полное видео кандидата</button></div>${asked[c.key].map((a,i)=>`<div class="asked-question"><span class="question-index">0${i+1}</span><div><span class="tag">${a.kind} вопрос</span><b>${a.q}</b></div><div><span class="answer-label">Ответ кандидата</span><span class="answer-quote">«${a.quote}»</span></div><button class="video-link" data-evidence="${c.key}" data-candidate="${candidateKey}" data-time="${a.time}"><strong>${a.time}</strong> · Открыть в видео</button></div>`).join('')}</div></div></article>`).join('')}</div>`}
    function result(){return recruiter(`${candidateCrumbs(DATA.candidate.id)}<div class="inline" style="justify-content:flex-end;margin-top:-58px;margin-bottom:22px;flex-wrap:wrap"><button class="btn ghost" data-go="recruiter-candidates">Вернуться к кандидатам</button><button class="btn" data-evidence="kafka" data-time="03:48">Ссылка на видео кандидата</button><button class="btn" data-action="download-review">Скачать финальное ревью</button><button class="btn primary" data-action="share-manager">Скопировать защищённую ссылку</button></div><section class="result-hero" id="recommendation"><div class="marker" style="color:#999">[01] РЕКОМЕНДАЦИЯ · ${DATA.candidate.id}</div><h1>${DATA.candidate.recommendation}</h1><p>Результат готов. Перед следующим этапом стоит уточнить личный вклад, production Kafka и измеримый результат. Решение о следующем шаге принимает человек.</p></section>${metricStrip()}<nav class="local-nav"><button data-scroll="decision-model">[02] Как сформирован итог</button><button data-scroll="candidate-summary">[03] Суммаризация</button><button data-scroll="competency-map">[04] Карта компетенций</button><button data-scroll="feedback">[05] Обратная связь</button><button data-scroll="contradictions">[06] Противоречия</button><button data-scroll="agent">[07] Адаптивный агент</button>${state.stretchAntifraud?'<button data-scroll="antifraud">[08] События прохождения</button>':''}</nav><section class="section" id="decision-model"><div class="section-head"><div><div class="marker">[02]</div><h2>Как сформирован итог</h2></div><span class="section-note">Demo-модель · без скрытого единого балла</span></div><div class="decision-model"><div><div class="marker">01</div><b>Взвешенная оценка</b><p>Только подтверждённые ответами аспекты компетенций; вес приходит из вакансии.</p></div><div><div class="marker">02</div><b>Покрытие 78%</b><p>Доля веса проверяемых требований, для которых собрано достаточно доказательств. Неизвестное не равно нулю.</p></div><div><div class="marker">03</div><b>Уверенность: средняя</b><p>Качество, прямота, согласованность и достаточность доказательств.</p></div><div><div class="marker">04</div><b>Критичные условия</b><p>Обязательные навыки и стоп-факторы проверяются отдельно; резюме само по себе их не подтверждает.</p></div></div><div class="band" style="margin-top:18px"><b>Почему нужна дополнительная проверка</b><p class="meta">Score высокий, но покрытие и уверенность недостаточны для однозначного вывода: нет измеримого production-результата по Kafka и не подтверждён bulk load PostgreSQL. Численные веса и пороги рекомендации требуют продуктовой валидации до MVP.</p></div></section><section class="section" id="candidate-summary"><div class="section-head"><div><div class="marker">[03]</div><h2>Суммаризация кандидата</h2></div><span class="section-note">Выводы связаны с ответами и доказательствами</span></div><div class="candidate-summary"><div><div class="marker">ОБЩИЙ ВЫВОД</div><h3>Сильная теоретическая база, требуется подтвердить масштаб практики</h3><p>Алексей уверенно объясняет технические механизмы и причинно-следственные связи. Недостаточно конкретных production-метрик и примеров самостоятельной реализации по части требований.</p></div><div><div class="marker">СИЛЬНЫЕ СТОРОНЫ</div><h3>Надёжность сообщений</h3><p>Ручной commit, идемпотентность, восстановление после повторной доставки и ясный личный вклад в consumer.</p></div><div><div class="marker">СЛАБЫЕ СТОРОНЫ</div><h3>Недостаточно измеримых результатов</h3><p>В ответах мало production-метрик, а практический опыт массовой загрузки PostgreSQL не подтверждён.</p></div><div><div class="marker">ЧТО СТОИТ УТОЧНИТЬ</div><h3>Масштаб и зона ответственности</h3><p>Запросить измеримые результаты Kafka-решения и отдельный production-пример массовой загрузки PostgreSQL.</p></div></div></section><section class="section" id="competency-map"><div class="section-head"><div><div class="marker">[04]</div><h2>Карта компетенций</h2></div><span class="section-note">3 компетенции · 11 доказательств</span></div>${competencyRows()}</section><section class="section" id="feedback"><div class="section-head"><div><div class="marker">[05]</div><h2>Обратная связь кандидату</h2></div>${status('Готова','success')}</div><div class="feedback-box"><div class="marker" style="color:#999">ТЕКСТ ДЛЯ КАНДИДАТА · БЕЗ ВНУТРЕННИХ МЕТРИК</div><p>Вы показали уверенное понимание надёжной обработки сообщений: объяснили ручное подтверждение, идемпотентность и свой вклад в изменение обработчика. Для следующего шага полезно подготовить конкретные примеры масштаба и измеримого результата production-решения, а также подробнее раскрыть опыт массовой загрузки в PostgreSQL. Сейчас команде требуется дополнительная проверка именно этих аспектов.</p><div class="feedback-actions"><button class="btn dark" data-action="copy-feedback">Скопировать текст</button><button class="btn dark" data-action="download-feedback">Скачать обратную связь</button></div></div><p class="meta">Для положительной рекомендации этот блок объясняет, какие подтверждённые требования стали основанием; для отрицательной — какие критичные требования не подтверждены или опровергнуты ответами. Личные характеристики и данные из резюме без подтверждения не используются.</p></section><section class="section" id="contradictions"><div class="section-head"><div><div class="marker">[06]</div><h2>Противоречия</h2></div>${status('Устранено уточнением','success')}</div><div class="contradiction-case"><div class="contradiction-case-head"><div><div class="marker">ASYNC PYTHON · ЛИЧНЫЙ ВКЛАД</div><h3>«Мы реализовали» и фактическая зона ответственности</h3></div><span class="meta">1 противоречие · закрыто</span></div><div class="contradiction-step"><div class="num">01</div><div><div class="marker">ЧТО СКАЗАЛ КАНДИДАТ</div><h4>В основном ответе действие команды прозвучало как собственная реализация</h4><p class="contradiction-quote">«Синхронный клиент блокировал event loop; мы вынесли вызов в executor»</p><button class="timestamp" data-evidence="async" data-candidate="alexey" data-time="11:06">11:06 · Открыть исходный ответ</button></div></div><div class="contradiction-step agent-observation"><div class="num">02</div><div><div class="marker">ЧТО ЗАМЕТИЛ АГЕНТ</div><h4>Формулировка «мы» не подтверждала личный вклад кандидата</h4><p>Агент зафиксировал расхождение между впечатлением от основного ответа и отсутствием конкретной персональной зоны ответственности. Это стало причиной уточнения, а не автоматического штрафа.</p></div></div><div class="contradiction-step agent-observation"><div class="num">03</div><div><div class="marker">ЧТО СДЕЛАЛ АГЕНТ</div><h4>Задал уточняющий вопрос</h4><p class="contradiction-quote">«Какую часть исправления реализовали лично вы, а что сделал другой разработчик?»</p><p>Кандидат уточнил: «Я участвовал в разборе причины, но реализацию общего адаптера делал другой разработчик».</p><button class="timestamp" data-evidence="async" data-candidate="alexey" data-time="11:42">11:42 · Открыть уточняющий ответ</button></div></div><div class="contradiction-step resolved"><div class="num">04</div><div><div class="contradiction-outcome">${status('Противоречие устранено','success')}<span class="meta">Роль кандидата прояснена</span></div><h4>Что изменилось в результате</h4><p>Стало ясно: кандидат диагностировал блокировку и участвовал в выборе решения, но не реализовывал общий адаптер лично. Противоречие закрыто; Async Python остаётся «Частично подтверждено» из-за недостаточного доказательства личной реализации, а не из-за противоречия.</p></div></div></div></section><section class="section" id="agent"><div class="section-head"><div><div class="marker">[07]</div><h2>Как работал Adaptive Interview Agent</h2></div><span class="section-note">Только наблюдаемая последовательность · синтетическая демонстрация</span></div><div class="agent-timeline"><div class="agent-step"><div class="num">01</div><div><h3>Основной вопрос</h3><p>Кандидат раскрыл архитектуру обработки сообщений.</p></div></div><div class="agent-step accent"><div class="num">02</div><div><h3>Не раскрыт личный вклад</h3><p>Не хватило доказательства по аспекту «Личный вклад».</p></div></div><div class="agent-step accent"><div class="num">03</div><div><h3>ИИ задаёт уточнение</h3><p>«Что именно в этом решении сделали лично вы и за какую часть отвечали?»</p></div></div><div class="agent-step good"><button class="timestamp num" data-evidence="kafka" data-time="04:32">04:32</button><div><h3>Получено доказательство</h3><p><button class="timestamp" data-evidence="kafka" data-time="04:32">«Я переписал consumer и настроил ручной commit после записи результата»</button></p><div class="transition-line"><span>Kafka:</span><b>Частично подтверждено</b><span>→</span><b>Подтверждено</b></div></div></div></div></section><section class="section"><div class="stretch-banner"><div><b>Stretch · События прохождения</b><div class="meta">Независимый технический контекст</div></div><label class="toggle"><input id="antifraudToggle" type="checkbox" ${state.stretchAntifraud?'checked':''}><span>${state.stretchAntifraud?'Включён':'Выключен'}</span></label></div></section>${state.stretchAntifraud?antifraud():''}`)}
    function antifraud(){return `<section class="section antifraud" id="antifraud"><div class="section-head"><div><div class="marker">[08] STRETCH · INDEPENDENT LAYER</div><h2>События прохождения</h2></div><span>${status('Verdict отсутствует')}</span></div><p><b>События прохождения не влияют на профессиональную оценку кандидата.</b></p><p class="meta">Они не меняют score, confidence, Competency Map или рекомендуемую очередность просмотра.</p><div class="af-metrics"><div><strong>10</strong><span class="meta">blur / focus</span></div><div><strong>1</strong><span class="meta">media interruption</span></div><div><strong>✓</strong><span class="meta">camera / mic restored</span></div><div><strong>0</strong><span class="meta">paste</span></div></div><div class="event-line"><span>04:08</span><span>Окно потеряло фокус</span><span>4 сек</span></div><div class="event-line"><span>08:44</span><span>Краткое прерывание media stream</span><span>2 сек</span></div><div class="event-line"><span>08:46</span><span>Камера и микрофон восстановлены</span><span>успешно</span></div></section>`}
    function currentTranscript(){return state.evidenceCandidate==='maria'?DATA.transcriptMaria:DATA.transcript}
    function evidenceViewer(manager=false){const transcript=currentTranscript();const candidateName=state.evidenceCandidate==='maria'?'Мария Орлова':'Алексей Кузнецов';const duration=state.evidenceCandidate==='maria'?720:800;const seg=transcript[state.segment];const content=`<div class="viewer-head"><div><div class="marker">[01] EVIDENCE VIEWER</div><h1 style="font-size:48px;letter-spacing:-.05em;font-weight:400;margin:8px 0 0">Видео и транскрипт</h1></div><button class="btn" data-go="${manager?'manager-competencies':state.evidenceCandidate==='maria'?'recruiter-result-one':'recruiter-result'}">← Назад к ${manager?'компетенциям':'результату'}</button></div><div class="evidence-context"><div><span class="meta">Компетенция</span><br><b>${seg.comp}</b></div><div><span class="meta">Аспект доказательства</span><br><b>${seg.dim}</b></div><div><span class="meta">Роль доказательства</span><br>${status('Подтверждает','success')}</div><div><span class="meta">Качество транскрипта</span><br><b>Высокое</b></div></div><section class="viewer section"><div class="video-side"><div class="video-frame"><span class="rec-chip">${candidateName} · интервью</span><div class="person"></div></div><div class="player-controls"><button class="play" data-action="play">▶</button><div class="progress" data-action="scrub"><span style="width:${Math.round(state.time/duration*100)}%"></span><i class="marker-dot" style="left:${Math.round(state.time/duration*100)}%"></i></div><span class="video-time">${formatTime(state.time)} / ${formatTime(duration)}</span></div></div><div class="transcript"><div class="transcript-toolbar"><b>Синхронизированный транскрипт</b><label class="toggle"><input type="checkbox" checked><span class="meta">Автопрокрутка</span></label></div><div class="segments">${transcript.map((s,i)=>`<div class="segment ${i===state.segment?'active':''}" data-segment="${i}"><span class="time">${s.t}</span><div><p>${s.text}</p><div class="segment-meta">${s.comp} · ${s.dim}</div></div></div>`).join('')}</div></div></section><section class="evidence-list"><div class="evidence-item"><div><div class="eyebrow">Доказательство</div><p>${seg.t}</p></div><div><b>${seg.comp} · ${seg.dim}</b><p>«${seg.text}»</p><div class="meta">Ответ на вопрос · качество транскрипта высокое</div></div><button class="btn small" data-segment="${state.segment}">Воспроизвести</button></div></section>`;return manager?managerShell(content,'answers'):recruiter(content)}
    function formatTime(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
    function candidateTop(){return `<header class="topbar"><div class="topbar-left"><div class="brand">ADAPTIVE<span>.</span> INTERVIEW</div><div class="sep-v"></div><span class="meta">Кабинет кандидата</span></div><div class="topbar-right"><span class="meta">Алексей Кузнецов</span><div class="sep-v"></div><button class="role-switch" data-action="change-role">Сменить роль</button></div></header>`}
    function stepper(active){const steps=['Приглашение','Согласие','Проверка','Интервью','Готово'];return `<div class="stepper">${steps.map((s,i)=>`<div class="step ${i<active?'done':i===active?'active':''}"><b>0${i+1}</b> <span>${s}</span></div>`).join('')}</div>`}
    function candidatePage(inner,active=0){return `<div class="candidate">${candidateTop()}<main class="candidate-wrap">${stepper(active)}${inner}</main></div>`}
    function progressiveText(text,question=false){return text.split(' ').map((word,i)=>`<span class="reveal-word" style="--i:${i}">${word}${i<text.split(' ').length-1?' ':''}</span>`).join('')}
    function liveInterview(){const q=LIVE_QUESTIONS[state.liveQuestion];const progress=((state.liveQuestion+1)/LIVE_QUESTIONS.length)*100;return `<div class="interview"><header class="interview-top"><div class="brand">ADAPTIVE<span>.</span> INTERVIEW</div><div class="continuous-chip"><span class="recording-dot"></span><span>Непрерывная запись · ${formatTime(state.seconds)}</span></div><button class="role-switch" style="color:#aaa" data-action="change-role">Сменить роль</button></header><div class="interview-progress"><span style="width:${progress}%"></span></div><main class="interview-main"><section class="interview-question live-copy">${state.liveQuestion===0?`<p class="live-greeting">${progressiveText('Здравствуйте, Алексей. Рада познакомиться. Интервью уже началось, запись будет идти непрерывно до завершения.')}</p>`:''}${state.liveTransition?`<div class="live-thinking">Формирую следующий вопрос по вашему ответу<span class="thinking-dots"><i></i><i></i><i></i></span><div class="meta" style="color:#999;margin-top:8px">Запись продолжается, дополнительных действий не требуется.</div></div>`:`<div class="live-question-label eyebrow">${q.type} · ${state.liveQuestion+1} из ${LIVE_QUESTIONS.length}</div><h1 class="live-question">${progressiveText(q.text,true)}</h1><p>Отвечайте в удобном темпе. Когда закончите мысль полностью, нажмите одну кнопку.</p>`}</section><div class="candidate-camera"><div class="person"></div><span class="camera-label">Камера · прямая запись</span><span class="rec-chip" style="left:auto;right:16px"><span class="recording-dot"></span> REC</span></div></main><footer class="record-bar"><div class="record-status"><span class="recording-dot"></span><b>Запись идёт непрерывно</b><span class="timer">${formatTime(state.seconds)}</span></div><div class="health"><span>Микрофон · активен</span><span>Соединение · стабильное</span><button class="demo-error" data-go="candidate-error">Сымитировать техническую ошибку</button></div><button class="btn primary" data-action="answer-live" ${state.liveTransition?'disabled':''}>Я ответил</button></footer></div>`}
    function candidatePortal(inner,active='status'){return `<div class="candidate-portal">${candidateTop()}<div class="candidate-portal-shell"><aside class="candidate-nav"><div class="candidate-name"><span class="meta">Кандидат</span><b>Алексей Кузнецов</b><span class="meta">${DATA.vacancy}</span></div><a href="#candidate-completed" data-go="candidate-completed" class="${active==='status'?'active':''}">Статус интервью</a><a href="#candidate-feedback" data-go="candidate-feedback" class="${active==='feedback'?'active':''}">Обратная связь</a></aside><main class="candidate-portal-main">${inner}</main></div></div>`}
    function invite(){return candidatePage(`<section class="candidate-hero"><div><div class="marker">[01] ПРИГЛАШЕНИЕ · АЛЕКСЕЙ КУЗНЕЦОВ</div><h1>${DATA.vacancy}</h1><p>Вам предложено пройти live-видеоинтервью с адаптивным интервьюером. После начала запись идёт непрерывно, а следующий вопрос появляется в том же сеансе.</p><button class="btn primary" data-go="candidate-consent" style="margin-top:22px">Продолжить</button></div><div><div class="marker">[02] КАК ЭТО РАБОТАЕТ</div><div class="process-list"><div class="process-line"><span>01</span><span>Проверить камеру и микрофон</span></div><div class="process-line"><span>02</span><span>Начать единую непрерывную запись</span></div><div class="process-line"><span>03</span><span>После каждого ответа нажимать только «Я ответил»</span></div></div></div></section><footer class="support">Техническая поддержка · demo-support@company.test</footer>`,0)}
    function consent(){return candidatePage(`<article class="consent"><div class="marker">[02] ПЕРЕД НАЧАЛОМ</div><h1>Правила и согласие</h1><section class="legal-section"><h3>Запись и обработка</h3><p>Во время интервью записываются видео и аудио. Содержание ответов транскрибируется и анализируется относительно требований вакансии.</p></section><section class="legal-section"><h3>Технические события</h3><p>Demo может фиксировать события браузера и media stream. Они сами по себе не определяют мошенничество и не влияют на профессиональную оценку.</p></section><section class="legal-section"><h3>Хранение данных</h3><p>Условия хранения подставляются из утверждённой политики. В прототипе срок не задаётся.</p></section><label class="checkline"><input id="consentCheck" type="checkbox" ${state.consent?'checked':''}><span>Я ознакомился с условиями записи и обработки и даю согласие продолжить.</span></label><div class="inline" style="justify-content:space-between"><button class="btn ghost" data-go="candidate-invite">Назад</button><button class="btn primary" id="consentContinue" data-go="candidate-devices" ${state.consent?'':'disabled'}>Согласен и продолжить</button></div></article>`,1)}
    function devices(){return candidatePage(`<div class="page-head"><div><div class="marker">[03] MEDIA CHECK</div><h1>Проверка оборудования</h1><p>Убедитесь, что вас видно и слышно. Проблемы показаны рядом с конкретным устройством.</p></div></div><div class="device-layout"><div class="camera ${state.devicesPassed?'':'camera-off'}"><span class="camera-label">Camera preview · 16:9</span></div><aside class="diag"><div class="diag-row"><div class="inline"><b>Камера</b>${status(state.devicesPassed?'Работает':'Нужен доступ',state.devicesPassed?'success':'warning')}</div><div class="meta">FaceTime HD Camera</div></div><div class="diag-row"><div class="inline"><b>Микрофон</b>${status(state.devicesPassed?'Сигнал есть':'Не проверен',state.devicesPassed?'success':'warning')}</div>${state.devicesPassed?'<div class="mic-meter"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>':''}<div class="meta">MacBook Microphone</div></div><div class="diag-row"><div class="inline"><b>Соединение</b>${status(state.devicesPassed?'Стабильное':'Ожидает проверки',state.devicesPassed?'success':'')}</div></div></aside></div><div class="inline" style="justify-content:flex-end;margin-top:22px"><button class="btn ghost" data-action="device-test">${state.devicesPassed?'Повторить проверку':'Разрешить доступ'}</button><button class="btn" data-action="test-record" ${state.devicesPassed?'':'disabled'}>Записать тест</button><button class="btn primary" data-go="candidate-ready" ${state.devicesPassed?'':'disabled'}>Всё работает — продолжить</button></div>`,2)}
    function ready(){return candidatePage(`<section class="ready"><div class="marker">[04] ГОТОВО К LIVE-СЕАНСУ</div><h1>Всё готово</h1><p>После старта интервьюер сначала поприветствует вас, затем постепенно покажет первый вопрос. Камера и микрофон будут записывать весь сеанс непрерывно.</p><div class="ready-checks"><div>${status('Камера готова','success')}</div><div>${status('Микрофон готов','success')}</div><div>${status('Согласие принято','success')}</div></div><button class="btn primary" data-action="live-start">Начать live-интервью</button><div style="margin-top:14px"><button class="role-switch" data-go="candidate-devices">Вернуться к проверке</button></div></section>`,2)}

    function recovery(){return candidatePage(`<section class="ready"><div class="marker">[04] СЕАНС НАЙДЕН</div><h1>Продолжить live-интервью</h1><p>Сохранена текущая позиция: вопрос ${state.liveQuestion+1} из ${LIVE_QUESTIONS.length}. После продолжения непрерывная запись возобновится с этого вопроса.</p><div class="ready-checks"><div><b>${state.liveQuestion}</b><br><span class="meta">ответов завершено</span></div><div>${status('Камера готова','success')}</div><div>${status('Микрофон готов','success')}</div></div><button class="btn primary" data-action="live-resume">Продолжить интервью</button><div style="margin-top:14px"><button class="role-switch" data-go="candidate-devices">Повторить проверку устройств</button></div></section>`,3)}
    function completion(){return candidatePortal(`<section class="candidate-status-hero"><div class="marker" style="color:#999">[01] ИНТЕРВЬЮ ЗАВЕРШЕНО</div><h1>Спасибо за ваши ответы</h1><p>Непрерывная запись остановлена. Интервью передано на обработку; здесь можно вернуться к статусу и открыть обратную связь после её подготовки.</p></section><section class="section"><div class="section-head"><div><div class="marker">[02]</div><h2>Статус</h2></div>${status('Обработка завершена','success')}</div><div class="summary-strip"><div class="summary-cell"><strong>${LIVE_QUESTIONS.length}</strong><span>вопроса в live-сеансе</span></div><div class="summary-cell"><strong>${formatTime(Math.max(state.seconds,18))}</strong><span>длительность записи</span></div><div class="summary-cell"><strong>✓</strong><span>запись получена</span></div><div class="summary-cell"><strong>✓</strong><span>обратная связь готова</span></div></div><div class="inline" style="justify-content:flex-end;margin-top:22px"><button class="btn primary" data-go="candidate-feedback">Посмотреть обратную связь</button></div></section>`, 'status')}
    function candidateFeedback(){return candidatePortal(`<div class="page-head"><div><div class="marker">[01] ОБРАТНАЯ СВЯЗЬ</div><h1>Итоги интервью</h1><p>Здесь нет внутренних оценок, рейтинга или решения команды — только профессиональная обратная связь по вашим ответам.</p></div>${status('Готово','success')}</div><div class="feedback-summary"><div><div class="marker">[01]</div><h3>Что удалось раскрыть</h3><p>Вы последовательно объяснили устройство надёжной обработки сообщений, ручное подтверждение и идемпотентность, а также обозначили свой личный вклад в изменение обработчика.</p></div><div><div class="marker">[02]</div><h3>Что можно усилить</h3><p>Полезно подготовить больше конкретных примеров масштаба и измеримого результата production-решений, а также подробнее раскрыть опыт массовой загрузки в PostgreSQL.</p></div><div><div class="marker">[03]</div><h3>На что обратить внимание дальше</h3><p>При ответах связывайте техническое решение со своей зоной ответственности, исходными ограничениями и результатом, который можно проверить по метрикам.</p></div></div><div class="band" style="margin-top:24px"><b>Обратная связь сформирована по содержанию ответов</b><p class="meta">Резюме использовалось только как контекст для вопросов; выводы выше основаны на интервью.</p></div>`, 'feedback')}
    function managerAccess(){return `<main class="access"><section class="access-box"><div class="inline" style="justify-content:space-between"><div class="brand">ADAPTIVE<span>.</span> INTERVIEW</div><span class="readonly" style="border-color:#777">Только просмотр</span></div><div class="marker" style="color:#999;margin-top:70px">[01] PROTECTED RESULT</div><h1>Вам передан<br>один результат</h1><p style="color:#bdbdc2">Вакансия: ${DATA.vacancy}. Ссылка ограничена результатом ${DATA.candidate.id} и не открывает recruiter workspace.</p><div class="scope"><div><span class="meta">Scope</span><br><b>${DATA.candidate.id}</b></div><div><span class="meta">Access</span><br><b>Только просмотр</b></div></div><div class="inline"><button class="btn primary" data-go="manager-summary">Открыть результат</button><button class="btn dark" data-action="change-role">Сменить роль</button></div></section></main>`}
    function managerTabs(active){return `<nav class="manager-tabs"><button class="${active==='summary'?'active':''}" data-go="manager-summary">Резюме</button><button class="${active==='competencies'?'active':''}" data-go="manager-competencies">Компетенции</button><button class="${active==='answers'?'active':''}" data-go="manager-answers">Ответы</button></nav>`}
    function managerShell(content,active){return `<div class="manager">${topbar(`${DATA.candidate.id} · ${DATA.vacancy}`,true)}<main class="manager-wrap">${managerTabs(active)}<div style="padding-top:34px">${content}</div></main></div>`}
    function managerSummary(){return managerShell(`<section class="result-hero"><div class="marker" style="color:#999">[01] RECOMMENDATION · ${DATA.candidate.id}</div><h1>${DATA.candidate.recommendation}</h1><p>Перед следующим этапом стоит уточнить личный ownership, production Kafka и измеримый результат. Это рекомендация для решения человека.</p></section>${metricStrip()}<section class="section strength-grid"><div><div class="marker">[03]</div><h2>Сильные стороны</h2><ul class="list-lines"><li>Broker mechanics и commit strategy</li><li>Идемпотентность и recovery</li><li>Диагностика причин в backend-системах</li></ul></div><div><div class="marker">[04]</div><h2>Проверить дальше</h2><ul class="list-lines"><li>Личный ownership в production Kafka</li><li>Измеримый результат и scale</li><li>Bulk load PostgreSQL</li></ul></div></section><section class="section"><div class="section-head"><div><div class="marker">[05]</div><h2>Competency overview</h2></div></div>${competencyRows('manager')}<div class="inline" style="justify-content:flex-end;margin-top:20px"><button class="btn" data-go="manager-competencies">Открыть карту компетенций</button><button class="btn primary" data-go="manager-answers">Смотреть ответы</button></div></section>`,'summary')}
    function managerCompetencies(){return managerShell(`<div class="page-head"><div><div class="marker">[02] READ-ONLY EVIDENCE MAP</div><h1>Компетенции</h1><p>Assessment и contradiction показаны независимо. Каждый существенный вывод раскрывается до первичного evidence.</p></div></div><div class="compact-overview"><section>${competencyRows('manager')}</section><aside class="sticky-summary"><div class="marker" style="color:#999">SCOPE</div><h2 style="font-size:28px">${DATA.candidate.id}</h2><p>Только переданный результат.</p><ul><li>3 competencies</li><li>11 evidence items</li><li>Coverage 78%</li><li>Confidence: Средняя</li></ul><button class="btn dark" data-evidence="kafka" data-time="04:32">Открыть Kafka evidence</button></aside></div>`,'competencies')}
    function managerAnswers(){return evidenceViewer(true)}
    function resultOne(){const c=DATA.candidates[0];return recruiter(`${candidateCrumbs(c.id)}<div class="inline" style="justify-content:flex-end;margin-top:-58px;margin-bottom:22px;flex-wrap:wrap"><button class="btn ghost" data-go="recruiter-candidates">Вернуться к кандидатам</button><button class="btn" data-evidence="kafka" data-candidate="maria" data-time="02:14">Ссылка на видео кандидата</button><button class="btn" data-action="download-review-one">Скачать финальное ревью</button></div><section class="result-hero"><div class="marker" style="color:#999">[01] РЕКОМЕНДАЦИЯ · ${c.id}</div><h1>${c.recommendation}</h1><p>Подтверждены ключевые обязательные требования; открытых критичных стоп-факторов нет. Решение о следующем шаге принимает человек.</p></section>${metricStrip(c)}<nav class="local-nav"><button data-scroll="candidate-summary-one">[02] Суммаризация</button><button data-scroll="competency-map-one">[03] Карта компетенций</button><button data-scroll="feedback-one">[04] Обратная связь</button></nav><section class="section" id="candidate-summary-one"><div class="section-head"><div><div class="marker">[02]</div><h2>Суммаризация кандидата</h2></div><span class="section-note">Выводы связаны с ответами и доказательствами</span></div><div class="candidate-summary"><div><div class="marker">ОБЩИЙ ВЫВОД</div><h3>Обязательные компетенции подтверждены</h3><p>Мария последовательно связывает технические решения со своей зоной ответственности и приводит измеримый результат по PostgreSQL.</p></div><div><div class="marker">СИЛЬНЫЕ СТОРОНЫ</div><h3>Kafka и PostgreSQL</h3><p>Идемпотентная обработка, безопасный commit, диагностика плана запроса и конкретное улучшение p95.</p></div><div><div class="marker">СЛАБЫЕ СТОРОНЫ</div><h3>Не хватает метрик Async Python</h3><p>Практическое решение описано, но влияние на производительность асинхронного сервиса не измерено.</p></div><div><div class="marker">ЧТО СТОИТ УТОЧНИТЬ</div><h3>Нагрузочный профиль</h3><p>На следующем этапе уточнить нагрузку, число параллельных задач и результат после ограничения конкурентности.</p></div></div></section><section class="section" id="competency-map-one"><div class="section-head"><div><div class="marker">[03]</div><h2>Карта компетенций</h2></div><span class="section-note">Нажмите на компетенцию: вопросы, цитаты и таймкоды откроются внутри строки</span></div>${competencyRows('recruiter',DATA.competenciesMaria,'maria')}</section><section class="section" id="feedback-one"><div class="section-head"><div><div class="marker">[04]</div><h2>Обратная связь кандидату</h2></div>${status('Готова','success')}</div><div class="feedback-box"><p>Вы подтвердили практический опыт надёжной обработки сообщений и работы с PostgreSQL, связав решения со своей зоной ответственности. Это стало основанием рекомендовать следующий этап. Дополнительно полезно подготовить пример с измеримыми нагрузочными метриками по асинхронным сервисам.</p></div></section>`)}
    function startTimer(){state.timer=setInterval(()=>{state.seconds++;document.querySelectorAll('.timer,.continuous-chip span:last-child').forEach(el=>el.textContent=el.classList.contains('timer')?formatTime(state.seconds):`Непрерывная запись · ${formatTime(state.seconds)}`)},1000)}
    function stopTimer(){clearInterval(state.timer);state.timer=null}
    function render(){const map={auth, 'recruiter-overview':overview,'recruiter-vacancies':vacancies,'recruiter-vacancy-create':vacancyCreate,'recruiter-settings':settings,'recruiter-competencies':competenciesSetup,'recruiter-questions':questions,'recruiter-candidates':candidates,'recruiter-people':candidates,'recruiter-candidate-create':candidateCreate,'recruiter-new-interview':candidateCreate,'recruiter-status':interviewStatus,'recruiter-review-order':reviewOrder,'recruiter-result':result,'recruiter-result-one':resultOne,'recruiter-evidence':()=>evidenceViewer(false),'candidate-invite':invite,'candidate-consent':consent,'candidate-devices':devices,'candidate-ready':ready,'candidate-live':liveInterview,'candidate-core':liveInterview,'candidate-saved':liveInterview,'candidate-followup':liveInterview,'candidate-followup-saved':liveInterview,'candidate-next':liveInterview,'candidate-error':candidateError,'candidate-recovery':recovery,'candidate-completed':completion,'candidate-feedback':candidateFeedback,'manager-access':managerAccess,'manager-summary':managerSummary,'manager-competencies':managerCompetencies,'manager-answers':managerAnswers};app.innerHTML=(map[state.route]||auth)();}
    document.addEventListener('click',e=>{
      const role=e.target.closest('[data-role]');if(role){state.role=role.dataset.role;if(state.role==='candidate'){state.liveQuestion=0;state.liveTransition=false;state.seconds=0;state.recording=false}go(role.dataset.role==='recruiter'?'recruiter-overview':role.dataset.role==='candidate'?'candidate-invite':'manager-access');return}
      const scrollEl=e.target.closest('[data-scroll]');if(scrollEl){document.getElementById(scrollEl.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return}
      const goEl=e.target.closest('[data-go]');if(goEl&&!goEl.disabled){e.preventDefault();go(goEl.dataset.go);return}
      const ev=e.target.closest('[data-evidence]');if(ev){state.evidenceCandidate=ev.dataset.candidate||(state.role==='manager'?'alexey':state.route==='recruiter-result-one'?'maria':'alexey');const transcript=currentTranscript();const idx=transcript.findIndex(s=>s.t===ev.dataset.time);state.segment=idx<0?0:idx;state.time=transcript[state.segment].sec;go(state.role==='manager'?'manager-answers':'recruiter-evidence');return}
      const seg=e.target.closest('[data-segment]');if(seg){const transcript=currentTranscript();state.segment=+seg.dataset.segment;state.time=transcript[state.segment].sec;render();setTimeout(()=>document.querySelector('.segment.active')?.scrollIntoView({block:'nearest'}),0);return}
      const comp=e.target.closest('.comp-summary');if(comp&&!comp.classList.contains('static')){const key=comp.closest('.comp-row').dataset.key;state.compOpen=state.compOpen===key?null:key;render();return}
      const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
      if(action==='change-role'){state.role=null;state.recording=false;go('auth')}
      if(action==='save')toast('Изменения сохранены в demo data')
      if(action==='parse-settings-file'){state.vacancyParsed=true;render();toast('Поля обновлены из файла и доступны для редактирования')}
      if(action==='add-competency'){state.extraCompetency=true;render();toast('Добавлена новая строка карты компетенций')}
      if(action==='delete-competency'){const key=e.target.closest('[data-key]').dataset.key;if(!state.hiddenCompetencies.includes(key))state.hiddenCompetencies.push(key);if(key==='extra')state.extraCompetency=false;render();toast('Компетенция удалена из карты')}
      if(action==='add-core-question'){state.extraQuestion=true;render();toast('Добавлен новый основной вопрос')}
      if(action==='delete-core-question'){const key=e.target.closest('[data-key]').dataset.key;if(!state.hiddenQuestions.includes(key))state.hiddenQuestions.push(key);if(key==='extraq')state.extraQuestion=false;render();toast('Основной вопрос и его уточнения удалены')}
      if(action==='add-followup'){const group=e.target.closest('[data-group]').dataset.group;if(!state.extraFollowups.includes(group))state.extraFollowups.push(group);render();toast('Добавлено адаптивное уточнение')}
      if(action==='delete-followup'){const key=e.target.closest('[data-key]').dataset.key;if(!state.hiddenFollowups.includes(key))state.hiddenFollowups.push(key);render();toast('Уточняющий вопрос удалён')}
      if(action==='save-vacancy'){toast('Вакансия сохранена');setTimeout(()=>go('recruiter-vacancies'),500)}
      if(action==='create-link'){toast('Персональная demo-ссылка создана');setTimeout(()=>go('recruiter-candidates'),700)}
      if(action==='share-manager')toast('Защищённая ссылка для менеджера скопирована')
      if(action==='parse-vacancy'){state.vacancyParsed=true;render();toast('Карточка создана из файла · проверьте извлечённые данные')}
      if(action==='parse-resume'){state.resumeParsed=true;render();toast('Резюме разобрано · создан персонализированный набор')}
      if(action==='generate-candidate-link'){state.candidateLinkCreated=true;render();toast('Персональная demo-ссылка сформирована')}
      if(action==='download-review')downloadText('candidate-02-final-review.txt',FINAL_REVIEW)
      if(action==='download-review-one')downloadText('candidate-01-final-review.txt',FINAL_REVIEW_ONE)
      if(action==='download-feedback')downloadText('candidate-02-feedback.txt',CANDIDATE_FEEDBACK)
      if(action==='copy-feedback'){copyText(CANDIDATE_FEEDBACK);toast('Обратная связь скопирована')}
      if(action==='device-test'){state.devicesPassed=true;render();toast('Доступ получен · камера, микрофон и соединение готовы')}
      if(action==='test-record')toast('Тестовая запись воспроизведена · звук есть')
      if(action==='live-start'){state.liveQuestion=0;state.liveTransition=false;state.seconds=0;state.recording=true;go('candidate-live');startTimer()}
      if(action==='live-resume'){state.liveTransition=false;state.recording=true;go('candidate-live');startTimer()}
      if(action==='answer-live'){if(state.liveTransition)return;if(state.liveQuestion>=LIVE_QUESTIONS.length-1){stopTimer();state.recording=false;go('candidate-completed')}else{state.liveTransition=true;render();setTimeout(()=>{if(state.route==='candidate-live'){state.liveQuestion++;state.liveTransition=false;render()}},1000)}}
      if(action==='record'){if(!state.recording){state.recording=true;state.seconds=0;render();startTimer()}else{const type=e.target.closest('[data-type]').dataset.type;stopTimer();state.recording=false;go(type==='core'?'candidate-saved':type==='followup'?'candidate-followup-saved':'candidate-completed')}}
      if(action==='copy-link')toast('Персональная ссылка скопирована')
      if(action==='retry-error'){toast('Соединение восстановлено');setTimeout(()=>go('candidate-recovery'),500)}
      if(action==='play')toast(`Воспроизведение с ${formatTime(state.time)}`)
      if(action==='scrub'){const transcript=currentTranscript();state.segment=Math.min(2,transcript.length-1);state.time=transcript[state.segment].sec;render()}
      if(action==='close-demo')go('auth')
    });
    document.addEventListener('change',e=>{
      if(e.target.id==='consentCheck'){state.consent=e.target.checked;render()}
      if(e.target.id==='candidateFilter'){state.candidateFilter=e.target.value;render()}
      if(e.target.id==='rankingToggle'){state.stretchRanking=e.target.checked;render();toast(state.stretchRanking?'Stretch-очередь включена':'Stretch-очередь скрыта')}
      if(e.target.id==='antifraudToggle'){state.stretchAntifraud=e.target.checked;render();toast(state.stretchAntifraud?'Antifraud Stretch включён':'Antifraud Stretch полностью скрыт')}
      if(e.target.id==='vacancyFile'){state.vacancyFileUploaded=!!e.target.files.length;render();toast('Файл вакансии добавлен')}
      if(e.target.id==='vacancySettingsFile'){state.vacancyFileUploaded=!!e.target.files.length;render();toast('Новая версия файла вакансии добавлена')}
      if(e.target.id==='questionFile'){state.specialistFileUploaded=!!e.target.files.length;render();toast('Файл вопросов технического специалиста добавлен')}
      if(e.target.id==='resumeFile'){state.resumeUploaded=!!e.target.files.length;render();toast('Резюме добавлено как отдельный источник')}
    });
    document.addEventListener('input',e=>{if(e.target.id==='vacancySearch'){state.search=e.target.value;const row=document.getElementById('vacancyRows');if(row)row.style.display=DATA.vacancy.toLowerCase().includes(state.search.toLowerCase())?'':'none'}})
    document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('comp-summary'))e.target.click()});
    window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(r&&r!==state.route){state.route=r;render()}});
    if(location.hash){state.route=location.hash.slice(1)}
    render();
  </script>
</body>
</html>
